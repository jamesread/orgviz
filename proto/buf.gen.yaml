version: v2
plugins:
  - local: protoc-gen-go
    out: ../service/gen/
    opt: paths=source_relative

  - local: protoc-gen-connect-go
    out: ../service/gen/
    opt: paths=source_relative

  - remote: buf.build/bufbuild/es
    out: ../frontend/src/gen/proto/

  - remote: buf.build/community/sudorandom-connect-openapi:v0.22.1
    out: ../service/gen
    opt:
      - format=json
      - path=openapi.json
      - path-prefix=/api
