# Marketing screenshots, captured by `make` in this directory against the
# throwaway orgviz instance it starts (see Makefile / seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18480/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/prepare.py
post_script_sleep = 2
theme = light
manifest_project = orgviz
manifest_base_url = https://raw.githubusercontent.com/jamesread/orgviz/main/var/marketing/screenshots/

[home]
url = .
title = Org chart
description = An interactive org chart for Example Company, with names, job titles and avatars, so reporting lines are visible at a glance.

[second-company]
url = .
script = scripts/light.py, scripts/prepare.py, scripts/second.py
title = Switch charts
description = Switch between organisation files from the header, so one orgviz instance can show several teams or companies.

# Dark variants last; the browser session (and prefers-color-scheme) is shared.
[home-dark]
url = .
script = scripts/dark.py, scripts/prepare.py
theme = dark
dark = true
title = Dark mode
description = The same org chart in a dark colour scheme that follows the browser preference, easier on the eyes in low light.
